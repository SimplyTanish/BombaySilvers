# Supabase project configuration
# https://supabase.com/docs/reference/cli/config

[project]
project_id = "bombay-silvers"   # replace with your Supabase project ref

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://*.pike.replit.dev"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.sms.twilio]
enabled = false
# Fill in when wiring OTP:
# account_sid = "env(TWILIO_ACCOUNT_SID)"
# message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
# auth_token = "env(TWILIO_AUTH_TOKEN)"
