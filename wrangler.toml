name = "simplytanish-bombaysilvers"
main = ".output/server/index.mjs"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]
no_bundle = true

[assets]
binding = "ASSETS"
directory = ".output/public"

rules = [
  { type = "ESModule", globs = ["**/*.mjs", "**/*.js"] },
]

# Non-secret runtime vars (secrets set via `wrangler secret put`)
[vars]
MCX_CACHE_TTL_MS     = "30000"
MCX_GOLD_DUTY_PCT    = "13"
MCX_SILVER_DUTY_PCT  = "17"
