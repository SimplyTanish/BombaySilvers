name = "simplytanish-bombaysilvers"
main = ".output/server/index.mjs"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]
no_bundle = true

[assets]
binding = "ASSETS"
directory = ".output/public"

rules = [
  { type = "ESModule", globs = ["**/*.mjs", "**/*.js"] },
]

# Non-secret runtime vars (secrets set via `wrangler secret put`)
[vars]
BULLIONLIVE_API_URL     = "https://bullionlive.app/api/price"
BULLIONLIVE_CACHE_TTL_MS = "30000"
